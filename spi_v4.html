<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPI単語帳">
<title>SPI単語帳</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');
:root {
  --ink:#1a1410; --paper:#f7f3ec; --warm:#e8dfd0; --border:#d4c9b8; --muted:#8a7968;
  --red:#c0392b; --red-bg:#fdf0ee; --green:#27ae60; --green-bg:#edfaf3;
  --blue:#2980b9; --orange:#e67e22; --orange-bg:#fef4e8;
  --shadow:rgba(60,40,20,0.13);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{font-family:'Noto Sans JP',sans-serif;background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}

.screen{display:none;flex-direction:column;flex:1;min-height:0}
.screen.active{display:flex}

header{background:var(--ink);color:var(--paper);padding:14px 16px;
  padding-top:max(14px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-family:'Noto Serif JP',serif;font-size:.95rem;font-weight:700;letter-spacing:.06em;flex:1}
.progress-bar{height:3px;background:var(--warm);flex-shrink:0}
.progress-fill{height:100%;background:var(--red);transition:width .35s ease}

/* HOME */
.home-body{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat-box{background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center}
.stat-num{font-family:'Noto Serif JP',serif;font-size:1.6rem;font-weight:700;line-height:1}
.stat-lbl{font-size:.68rem;color:var(--muted);margin-top:4px}
.stat-box.s-mastered .stat-num{color:var(--green)}
.stat-box.s-weak .stat-num{color:var(--red)}
.section-title{font-size:.72rem;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.accuracy-bar-wrap{background:var(--warm);border-radius:8px;height:8px;overflow:hidden;margin-top:6px}
.accuracy-bar{height:100%;background:var(--green);border-radius:8px;transition:width .5s ease}

.mode-list{display:flex;flex-direction:column;gap:10px}
.mode-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;
  padding:16px 18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:transform .1s,box-shadow .1s}
.mode-card:active{transform:scale(.97)}
.mode-icon{font-size:1.6rem;flex-shrink:0}
.mode-info{flex:1}
.mode-title{font-weight:700;font-size:.95rem}
.mode-desc{font-size:.72rem;color:var(--muted);margin-top:2px}
.mode-badge{font-size:.7rem;padding:3px 8px;border-radius:10px;font-weight:700;white-space:nowrap}
.badge-all{background:var(--warm);color:var(--muted)}
.badge-weak{background:var(--red-bg);color:var(--red)}
.badge-master{background:var(--green-bg);color:var(--green)}

/* CARD SCREEN */
.card-header{background:var(--ink);color:var(--paper);padding:10px 16px;
  padding-top:max(10px,env(safe-area-inset-top));
  display:flex;align-items:center;gap:10px;flex-shrink:0}
.back-btn{background:transparent;border:none;color:var(--paper);font-size:1.3rem;
  padding:4px 8px;cursor:pointer;line-height:1}
.card-header-info{flex:1;text-align:center}
.card-mode-label{font-size:.68rem;color:rgba(255,255,255,.6);letter-spacing:.08em}
.card-counter{font-size:.82rem;font-variant-numeric:tabular-nums}
.card-mastered-ct{font-size:.72rem;color:var(--green)}
.card-progress-bar{height:3px;background:rgba(255,255,255,.15);flex-shrink:0}
.card-progress-fill{height:100%;background:var(--green);transition:width .35s ease}

.card-main{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:16px 18px 12px;gap:12px;overflow:hidden}

.card-wrap{width:100%;max-width:480px;flex:1;min-height:0;position:relative}
.card{width:100%;height:100%;min-height:200px;position:relative;
  transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);will-change:transform}
.card.flipped{transform:rotateY(180deg)}

.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:16px;border:1.5px solid var(--border);background:#fff;
  box-shadow:0 4px 20px var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px 48px;gap:12px;overflow:hidden}
.face.back{transform:rotateY(180deg);background:var(--red-bg);border-color:#e0b0aa}
.card.mastered .face.front{border-color:var(--green);background:var(--green-bg)}
.card.weak .face.front{border-color:var(--orange);background:var(--orange-bg)}

.face-label{position:absolute;top:12px;left:16px;font-size:.62rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.face-badge{position:absolute;top:10px;right:12px;font-size:1rem;opacity:0;transition:opacity .3s}
.card.mastered .face-badge{opacity:1}
.card.weak .face-badge{opacity:1}

/* FRONT: big kanji only */
.front-phrase{font-family:'Noto Serif JP',serif;
  font-size:clamp(1.8rem,8vw,2.6rem);
  line-height:2.2;text-align:center}
.front-phrase ruby.rk{color:var(--red);font-weight:700}
.front-phrase ruby.rk rt{color:var(--red);font-size:.38em}

/* BACK */
.back-meaning{font-size:clamp(1rem,4vw,1.15rem);line-height:1.8;
  text-align:center;font-weight:500}
.back-divider{width:40px;height:1.5px;background:var(--border);border-radius:2px}
.back-example{font-size:clamp(.8rem,3.2vw,.95rem);line-height:1.9;
  text-align:center;color:var(--muted)}
.back-example ruby.rk{color:var(--red);font-weight:700}
.back-example ruby.rk rt{color:var(--red);font-size:.52em}
.example-label{font-size:.62rem;letter-spacing:.1em;color:var(--muted);align-self:flex-start;margin-left:4px}

.tap-hint{position:absolute;bottom:12px;font-size:.62rem;color:var(--muted);
  display:flex;align-items:center;gap:4px}

.answer-row{width:100%;max-width:480px;display:grid;grid-template-columns:1fr 1fr;
  gap:10px;flex-shrink:0}
.answer-row.hidden{visibility:hidden}
.ans-btn{padding:13px;border:none;border-radius:12px;font-family:'Noto Sans JP',sans-serif;
  font-size:.88rem;font-weight:700;cursor:pointer;transition:transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px}
.ans-btn:active{transform:scale(.95)}
.ans-btn:disabled{opacity:.5}
.ans-btn.correct{background:var(--green);color:#fff}
.ans-btn.wrong{background:var(--red);color:#fff}

.swipe-guide{width:100%;max-width:480px;display:flex;justify-content:space-between;
  align-items:center;flex-shrink:0}
.guide-item{display:flex;align-items:center;gap:4px;font-size:.65rem;color:var(--muted)}

.nav{width:100%;max-width:480px;display:grid;grid-template-columns:1fr auto 1fr;
  gap:10px;flex-shrink:0}
.btn{padding:13px 10px;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;
  font-size:.85rem;font-weight:500;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.3;pointer-events:none}
.btn-prev{background:var(--warm);color:var(--ink)}
.btn-next{background:var(--ink);color:var(--paper)}
.btn-shuffle{background:transparent;border:1.5px solid var(--border);color:var(--muted);
  padding:10px 12px;border-radius:10px;font-size:.7rem;cursor:pointer;
  display:flex;align-items:center;gap:4px;white-space:nowrap}
.btn-shuffle:active{background:var(--warm)}

.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom,0px));
  left:50%;transform:translateX(-50%) translateY(20px);
  background:#333;color:#fff;padding:9px 18px;border-radius:20px;
  font-size:.82rem;opacity:0;transition:opacity .25s,transform .25s;
  pointer-events:none;white-space:nowrap;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.green{background:var(--green)}
.toast.orange{background:var(--orange)}

.finish{position:fixed;inset:0;background:rgba(26,20,16,.85);
  display:none;align-items:center;justify-content:center;z-index:300;padding:24px}
.finish.show{display:flex}
.finish-box{background:#fff;border-radius:20px;padding:32px 28px;max-width:340px;width:100%;text-align:center}
.finish-emoji{font-size:3rem;margin-bottom:12px}
.finish-title{font-family:'Noto Serif JP',serif;font-size:1.3rem;font-weight:700;margin-bottom:8px}
.finish-sub{font-size:.85rem;color:var(--muted);margin-bottom:20px;line-height:1.7}
.finish-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.fstat{background:var(--paper);border-radius:10px;padding:12px;text-align:center}
.fstat-num{font-size:1.4rem;font-weight:700}
.fstat-lbl{font-size:.68rem;color:var(--muted);margin-top:2px}
.finish-btns{display:flex;flex-direction:column;gap:8px}
.finish-btn{padding:13px;border:none;border-radius:10px;font-family:'Noto Sans JP',sans-serif;
  font-size:.9rem;font-weight:700;cursor:pointer}
.finish-btn.primary{background:var(--ink);color:#fff}
.finish-btn.secondary{background:var(--warm);color:var(--ink)}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="screenHome">
  <header><h1>📖 SPI 単語帳</h1></header>
  <div class="progress-bar"><div class="progress-fill" id="homeProgress" style="width:0%"></div></div>
  <div class="home-body">
    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-num">210</div>
        <div class="stat-lbl">全カード</div>
      </div>
      <div class="stat-box s-mastered">
        <div class="stat-num" id="statMastered">0</div>
        <div class="stat-lbl">✅ 覚えた</div>
      </div>
      <div class="stat-box s-weak">
        <div class="stat-num" id="statWeak">0</div>
        <div class="stat-lbl">🔥 苦手</div>
      </div>
    </div>
    <div>
      <div class="accuracy-bar-wrap">
        <div class="accuracy-bar" id="homeAccBar" style="width:0%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:5px">
        <span style="font-size:.68rem;color:var(--muted)">正答率</span>
        <span style="font-size:.68rem;color:var(--green);font-weight:700" id="homeAccPct">—</span>
      </div>
    </div>
    <div class="section-title">練習モードを選ぶ</div>
    <div class="mode-list">
      <div class="mode-card" onclick="startMode('all')">
        <div class="mode-icon">📚</div>
        <div class="mode-info">
          <div class="mode-title">全カード</div>
          <div class="mode-desc">210枚すべてを練習</div>
        </div>
        <div class="mode-badge badge-all">210枚</div>
      </div>
      <div class="mode-card" onclick="startMode('unknown')">
        <div class="mode-icon">🎯</div>
        <div class="mode-info">
          <div class="mode-title">未習得のみ</div>
          <div class="mode-desc">覚えた・苦手を除いて練習／続きから</div>
        </div>
        <div class="mode-badge badge-all" id="badgeUnknown">210枚</div>
      </div>
      <div class="mode-card" onclick="startMode('weak')">
        <div class="mode-icon">🔥</div>
        <div class="mode-info">
          <div class="mode-title">苦手カード集中</div>
          <div class="mode-desc">不正解が多いカードを優先／続きから</div>
        </div>
        <div class="mode-badge badge-weak" id="badgeWeak">0枚</div>
      </div>
      <div class="mode-card" onclick="startMode('mastered')">
        <div class="mode-icon">✅</div>
        <div class="mode-info">
          <div class="mode-title">覚えたカード確認</div>
          <div class="mode-desc">マーク済みカードを復習</div>
        </div>
        <div class="mode-badge badge-master" id="badgeMastered">0枚</div>
      </div>
    </div>
  </div>
</div>

<!-- CARD SCREEN -->
<div class="screen" id="screenCard">
  <div class="card-header">
    <button class="back-btn" onclick="goHome()">‹</button>
    <div class="card-header-info">
      <div class="card-mode-label" id="modeLabel">全カード</div>
      <div class="card-counter" id="cardCounter">1 / 210</div>
    </div>
    <div class="card-mastered-ct" id="cardMasteredCt"></div>
  </div>
  <div class="card-progress-bar"><div class="card-progress-fill" id="cardProg" style="width:0%"></div></div>

  <div class="card-main">
    <div class="card-wrap" id="cardWrap">
      <div class="card" id="card">
        <div class="face front">
          <span class="face-label">語句</span>
          <span class="face-badge" id="faceBadge"></span>
          <div class="front-phrase" id="frontHTML"></div>
          <div class="tap-hint">タップして意味を確認</div>
        </div>
        <div class="face back">
          <span class="face-label">意味</span>
          <div class="back-meaning" id="backMeaning"></div>
          <div class="back-divider"></div>
          <span class="example-label">例）</span>
          <div class="back-example" id="backExample"></div>
          <div class="tap-hint">○か✗で次へ進む</div>
        </div>
      </div>
    </div>

    <div class="answer-row hidden" id="answerRow">
      <button class="ans-btn wrong" onclick="recordAnswer(false)">✗ 不正解</button>
      <button class="ans-btn correct" onclick="recordAnswer(true)">○ 正解</button>
    </div>

    <div class="swipe-guide">
      <div class="guide-item">← 右スワイプで前へ</div>
      <div class="guide-item">左スワイプで次へ →</div>
    </div>

    <div class="nav">
      <button class="btn btn-prev" id="prevBtn" onclick="go(-1)">← 前へ</button>
      <button class="btn-shuffle" onclick="doShuffle()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
        シャッフル
      </button>
      <button class="btn btn-next" id="nextBtn" onclick="go(1)">次へ →</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="finish" id="finish">
  <div class="finish-box">
    <div class="finish-emoji" id="finishEmoji">🎉</div>
    <div class="finish-title">セッション完了！</div>
    <div class="finish-sub" id="finishSub"></div>
    <div class="finish-stats">
      <div class="fstat"><div class="fstat-num" id="fCorrect" style="color:var(--green)">0</div><div class="fstat-lbl">正解</div></div>
      <div class="fstat"><div class="fstat-num" id="fWrong" style="color:var(--red)">0</div><div class="fstat-lbl">不正解</div></div>
      <div class="fstat"><div class="fstat-num" id="fAcc" style="color:var(--blue)">—</div><div class="fstat-lbl">正答率</div></div>
      <div class="fstat"><div class="fstat-num" id="fMastered" style="color:var(--green)">0</div><div class="fstat-lbl">覚えた数</div></div>
    </div>
    <div class="finish-btns">
      <button class="finish-btn primary" onclick="retryWrong()">🔥 不正解だけもう一度</button>
      <button class="finish-btn secondary" onclick="goHome()">ホームに戻る</button>
    </div>
  </div>
</div>

// ── state ──
const mastered = new Set();
const wrong    = new Set();
const stats    = {};
let deck = [], idx = 0, flipped = false, answered = false;
let currentMode = 'all';
let sessionCorrect = 0, sessionWrong = 0;

// ── save / load ──
function saveData() {
  try {
    localStorage.setItem('spi_mastered', JSON.stringify([...mastered]));
    localStorage.setItem('spi_stats', JSON.stringify(stats));
  } catch(e) {}
}

function loadData() {
  try {
    const m = localStorage.getItem('spi_mastered');
    if (m) JSON.parse(m).forEach(i => mastered.add(i));
    const s = localStorage.getItem('spi_stats');
    if (s) Object.assign(stats, JSON.parse(s));
  } catch(e) {}
}

function saveProgress(mode, i) {
  try { localStorage.setItem('spi_progress_' + mode, i); } catch(e) {}
}
function loadProgress(mode) {
  try { return parseInt(localStorage.getItem('spi_progress_' + mode) || '0'); } catch(e) { return 0; }
}

// ── util ──
function isWeak(oi) {
  const s = stats[oi];
  return s && (s.correct + s.wrong) > 0 && s.wrong > s.correct;
}

function showToast(msg, cls='') {
  const t = document.getElementById('toast');
  t.className = 'toast ' + cls;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── home ──
function updateHome() {
  const mCount = mastered.size;
  const wCount = CARDS.map((_,i)=>i).filter(i => !mastered.has(i) && isWeak(i)).length;
  const unknownCount = CARDS.map((_,i)=>i).filter(i => !mastered.has(i) && !isWeak(i)).length;

  document.getElementById('statMastered').textContent = mCount;
  document.getElementById('statWeak').textContent = wCount;
  document.getElementById('badgeUnknown').textContent = unknownCount + '枚';
  document.getElementById('badgeWeak').textContent = wCount + '枚';
  document.getElementById('badgeMastered').textContent = mCount + '枚';

  const totalAnswered = Object.values(stats).reduce((a,s)=>a+s.correct+s.wrong, 0);
  const totalCorrect  = Object.values(stats).reduce((a,s)=>a+s.correct, 0);
  const acc = totalAnswered ? Math.round(totalCorrect/totalAnswered*100) : null;
  document.getElementById('homeAccPct').textContent = acc !== null ? acc + '%' : '—';
  document.getElementById('homeAccBar').style.width = acc !== null ? acc + '%' : '0%';
  document.getElementById('homeProgress').style.width = CARDS.length ? (mCount/CARDS.length*100) + '%' : '0%';
}

function goHome() {
  document.getElementById('screenHome').classList.add('active');
  document.getElementById('screenCard').classList.remove('active');
  document.getElementById('finish').classList.remove('show');
  updateHome();
}

// ── mode start ──
function startMode(mode) {
  currentMode = mode;
  sessionCorrect = 0; sessionWrong = 0;

  let indices = [];
  if (mode === 'all') {
    indices = CARDS.map((_,i)=>i);
  } else if (mode === 'unknown') {
    // 覚えた・苦手を除く
    indices = CARDS.map((_,i)=>i).filter(i => !mastered.has(i) && !isWeak(i));
    if (!indices.length) { showToast('対象カードがありません！'); return; }
  } else if (mode === 'weak') {
    indices = CARDS.map((_,i)=>i).filter(i => !mastered.has(i) && isWeak(i));
    if (!indices.length) { showToast('苦手カードがまだありません'); return; }
  } else if (mode === 'mastered') {
    indices = [...mastered];
    if (!indices.length) { showToast('まだ覚えたカードがありません'); return; }
  }

  deck = indices.map(i => CARDS[i]);

  const labels = {all:'全カード', unknown:'未習得のみ', weak:'🔥 苦手集中', mastered:'✅ 覚えた確認'};
  document.getElementById('modeLabel').textContent = labels[mode] || '';

  // unknown・weak は前回の続きから
  if (mode === 'unknown' || mode === 'weak') {
    const saved = loadProgress(mode);
    idx = Math.min(saved, deck.length - 1);
  } else {
    idx = 0;
  }

  document.getElementById('screenHome').classList.remove('active');
  document.getElementById('screenCard').classList.add('active');
  show();
}

// ── card show ──
function show() {
  flipped = false; answered = false;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('answerRow').classList.add('hidden');

  const c = deck[idx];
  const oi = CARDS.indexOf(c);
  const s  = stats[oi] || {correct:0, wrong:0};

  document.getElementById('frontHTML').innerHTML = c.f;
  document.getElementById('backMeaning').textContent = c.m;
  document.getElementById('backExample').innerHTML = c.e;
  document.getElementById('cardCounter').textContent = `${idx+1} / ${deck.length}`;
  document.getElementById('cardProg').style.width = `${(idx+1)/deck.length*100}%`;
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === deck.length - 1;

  const isMastered = mastered.has(oi);
  const isWk = isWeak(oi);
  document.getElementById('card').classList.toggle('mastered', isMastered);
  document.getElementById('card').classList.toggle('weak', !isMastered && isWk);
  document.getElementById('faceBadge').textContent = isMastered ? '✅' : (isWk ? '🔥' : '');
  document.getElementById('cardMasteredCt').textContent = mastered.size > 0 ? `✅${mastered.size}` : '';
}

function flip() {
  if (flipped) return;
  flipped = true;
  document.getElementById('card').classList.add('flipped');
  document.getElementById('answerRow').classList.remove('hidden');
  document.getElementById('prevBtn').disabled = true;
  document.getElementById('nextBtn').disabled = true;
}

function go(d) {
  if (d > 0 && flipped && !answered) {
    showToast('○か✗を押してください');
    return;
  }
  const next = idx + d;
  if (next < 0 || next >= deck.length) return;
  answered = false;
  idx = next;
  show();
}

function doShuffle() {
  for (let i=deck.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [deck[i],deck[j]]=[deck[j],deck[i]];
  }
  idx=0; show();
  showToast('シャッフルしました');
}

// ── answer ──
function recordAnswer(correct) {
  if (answered) return;
  answered = true;
  const oi = CARDS.indexOf(deck[idx]);
  if (!stats[oi]) stats[oi] = {correct:0, wrong:0};

  if (correct) {
    stats[oi].correct++;
    sessionCorrect++;
    mastered.add(oi);
    // 正解したら苦手から除外
    wrong.delete(oi);
    showToast('○ 正解！✅', 'green');
  } else {
    stats[oi].wrong++;
    sessionWrong++;
    wrong.add(oi);
    // 不正解なら覚えたから除外
    mastered.delete(oi);
    showToast('✗ 不正解🔥', 'orange');
  }

  saveData();
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);

  setTimeout(() => {
    document.querySelectorAll('.ans-btn').forEach(b => b.disabled = false);
    answered = false;
    if (idx < deck.length - 1) {
      idx++;
      // 進捗保存（unknown・weakのみ）
      if (currentMode === 'unknown' || currentMode === 'weak') {
        saveProgress(currentMode, idx);
      }
      show();
    } else {
      if (currentMode === 'unknown' || currentMode === 'weak') {
        saveProgress(currentMode, 0); // 完了したらリセット
      }
      showFinish();
    }
  }, 800);
}

// ── finish ──
function showFinish() {
  const total = sessionCorrect + sessionWrong;
  const acc = total ? Math.round(sessionCorrect/total*100) : null;
  const emoji = acc === null ? '🎉' : acc >= 80 ? '🏆' : acc >= 50 ? '👍' : '💪';
  document.getElementById('finishEmoji').textContent = emoji;
  document.getElementById('finishSub').textContent = `${deck.length}枚を学習しました。`;
  document.getElementById('fCorrect').textContent = sessionCorrect;
  document.getElementById('fWrong').textContent = sessionWrong;
  document.getElementById('fAcc').textContent = acc !== null ? acc + '%' : '—';
  document.getElementById('fMastered').textContent = mastered.size;
  document.getElementById('finish').classList.add('show');
}

function retryWrong() {
  const wrongDeck = [...wrong].map(i => CARDS[i]);
  if (!wrongDeck.length) { showToast('不正解カードはありません'); return; }
  document.getElementById('finish').classList.remove('show');
  wrong.clear();
  sessionCorrect = 0; sessionWrong = 0;
  deck = wrongDeck;
  idx = 0;
  document.getElementById('modeLabel').textContent = '🔥 不正解リトライ';
  show();
}

// ── touch ──
const cWrap = document.getElementById('cardWrap');
let tx=0, ty=0, tt=0, dragging=false;
cWrap.addEventListener('touchstart', e=>{
  tx=e.touches[0].clientX; ty=e.touches[0].clientY; tt=Date.now(); dragging=false;
},{passive:true});
cWrap.addEventListener('touchmove', e=>{
  const dx=e.touches[0].clientX-tx, dy=e.touches[0].clientY-ty;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>8) dragging=true;
},{passive:true});
cWrap.addEventListener('touchend', e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  const dt=Date.now()-tt;
  if(dragging){
    if(dx>60) go(-1);
    else if(dx<-60) go(1);
  } else if(dt<350&&Math.abs(dx)<15&&Math.abs(dy)<15){
    flip();
  }
  dragging=false;
},{passive:true});

// keyboard
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') go(-1);
  else if(e.key==='ArrowRight') go(1);
  else if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='1') recordAnswer(true);
  else if(e.key==='2') recordAnswer(false);
});

loadData();
updateHome();
</script>
</body>
</html>
